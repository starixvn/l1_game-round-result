build_image_grr_prod:
  extends:
    - .deploy_vars_grr
    - .build_image
    - .deploy:prod-auto:rules
  environment:
    name: PROD

post_build_grr_prod:
  extends:
    - .deploy_vars_grr
    - .post_build
    - .deploy:prod-auto:rules
  needs: ['build_image_grr_prod']
  environment:
    name: PROD

deploy_grr_prod:
  extends:
    - .deploy_vars_grr
    - .base_deploy_kbt
    - .deploy:prod:rules
  needs: ['post_build_grr_prod']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_PROD
    SERVER_USER: $SC_SWARM_LEADER_PROD_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_PROD_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_PROD
    SWARM_REPLICAS: 1
    NODE_LABEL: L2_API
    DOCKER_NETWORK_NAME: lumi-network
    DOCKER_PUBLIC_PORT: 8315
    DOCKER_PRIVATE_PORT: 8315
  environment:
    name: PROD
