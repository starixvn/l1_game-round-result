build_image_grr_prod:
  extends:
    - .deploy_vars_grr
    - .build_image
    - .deploy:prod-auto:rules
  environment:
    name: PROD

post_build_grr_prod:
  extends:
    - .deploy_vars_grr
    - .post_build
    - .deploy:prod-auto:rules
  needs: ['build_image_grr_prod']
  environment:
    name: PROD

deploy_grr_prod:
  extends:
    - .deploy_vars_grr
    - .base_deploy_kbt
    - .deploy:prod:rules
  needs: ['post_build_grr_prod']
  variables:
    SERVER_IP: $PROD_IP
    SERVER_USER: $PROD_USER
    SERVER_PORT: $PROD_SSH_PORT
    DOCKER_PUBLIC_PORT: 8505
    DOCKER_PRIVATE_PORT: 8505
  environment:
    name: PROD
