build_image_grr_local:
  extends:
    - .deploy_vars_grr
    - .build_image
    - .deploy-grr:local:rules
  environment:
    name: LOCAL

post_build_grr_local:
  extends:
    - .deploy_vars_grr
    - .post_build
    - .deploy-grr:local:rules
  needs: ['build_image_grr_local']
  environment:
    name: LOCAL

deploy_grr_local:
  extends:
    - .deploy_vars_grr
    - .base_deploy_swarm_service
    - .deploy-grr:local:rules
  needs: ['post_build_grr_local']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_LOCAL
    SERVER_USER: $SC_SWARM_LEADER_LOCAL_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_LOCAL_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_LOCAL
    SWARM_REPLICAS: 1
    NODE_LABEL: L1
    DOCKER_PUBLIC_PORT: 8104
    DOCKER_PRIVATE_PORT: 8104
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: LOCAL
