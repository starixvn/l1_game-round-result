build_image_grr_local:
  extends:
    - .deploy_vars_grr
    - .build_image
    - .deploy-grr:local:rules
  environment:
    name: LOCAL

post_build_grr_local:
  extends:
    - .deploy_vars_grr
    - .post_build
    - .deploy-grr:local:rules
  needs: ['build_image_grr_local']
  environment:
    name: LOCAL

deploy_grr_local:
  extends:
    - .deploy_vars_grr
    - .base_deploy_local
    - .deploy-grr:local:rules
  needs: ['post_build_grr_local']
  variables:
    SERVER_IP: $LOCAL_IP
    SERVER_USER: $LOCAL_USER
    SERVER_PORT: $LOCAL_SSH_PORT
    DOCKER_PUBLIC_PORT: 7781
    DOCKER_PRIVATE_PORT: 7781
  environment:
    name: LOCAL
