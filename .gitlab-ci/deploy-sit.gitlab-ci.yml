build_image_grr_sit:
  extends:
    - .deploy_vars_grr
    - .build_image
    - .deploy-grr:sit:rules
  environment:
    name: SIT

post_build_grr_sit:
  extends:
    - .deploy_vars_grr
    - .post_build
    - .deploy-grr:sit:rules
  needs: ['build_image_grr_sit']
  environment:
    name: SIT

deploy_grr_sit:
  extends:
    - .deploy_vars_grr
    - .base_deploy_kbt
    - .deploy-grr:sit:rules
  needs: ['post_build_grr_sit']
  variables:
    SERVER_IP: $SIT_IP
    SERVER_USER: $SIT_USER
    SERVER_PORT: $SIT_SSH_PORT
    DOCKER_PUBLIC_PORT: 6505
    DOCKER_PRIVATE_PORT: 6505
  environment:
    name: SIT
