build_image_grr_sit:
  extends:
    - .deploy_vars_grr
    - .build_image
    - .deploy-grr:sit:rules
  environment:
    name: SIT

post_build_grr_sit:
  extends:
    - .deploy_vars_grr
    - .post_build
    - .deploy-grr:sit:rules
  needs: ['build_image_grr_sit']
  environment:
    name: SIT

deploy_grr_sit:
  extends:
    - .deploy_vars_grr
    - .base_deploy_swarm_service
    - .deploy-grr:sit:rules
  needs: ['post_build_grr_sit']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_SIT
    SERVER_USER: $SC_SWARM_LEADER_SIT_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_SIT_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_SIT
    SWARM_REPLICAS: 1
    NODE_LABEL: L2
    DOCKER_NETWORK_NAME: lumi-network
    DOCKER_PUBLIC_PORT: 6515
    DOCKER_PRIVATE_PORT: 6515
  environment:
    name: SIT
