build_image_grr_uat:
  extends:
    - .deploy_vars_grr
    - .build_image
    - .deploy-grr:uat:rules
  environment:
    name: UAT

post_build_grr_uat:
  extends:
    - .deploy_vars_grr
    - .post_build
    - .deploy-grr:uat:rules
  needs: ['build_image_grr_uat']
  environment:
    name: UAT

deploy_grr_uat:
  extends:
    - .deploy_vars_grr
    - .base_deploy_kbt
    - .deploy-grr:uat:rules
  needs: ['post_build_grr_uat']
  variables:
    SERVER_IP: $SIT_IP
    SERVER_USER: $SIT_USER
    SERVER_PORT: $SIT_SSH_PORT
    DOCKER_PUBLIC_PORT: 7505
    DOCKER_PRIVATE_PORT: 7505
  environment:
    name: UAT
