.if-deploy-all: &if-deploy-all
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/'

.if-deploy-local: &if-deploy-local
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-local-\d{8}-\d+.*$/'

.if-deploy-sit: &if-deploy-sit
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-sit-\d{8}-\d+.*$/'

.if-deploy-uat: &if-deploy-uat
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-uat-\d{8}-\d+.*$/'

.if-deploy-all-grr: &if-deploy-all-grr
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-grr-\d{8}-\d+.*$/'

.if-deploy-grr-local: &if-deploy-grr-local
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-local-grr-\d{8}-\d+.*$/'

.if-deploy-grr-sit: &if-deploy-grr-sit
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-sit-grr-\d{8}-\d+.*$/'

.if-deploy-grr-uat: &if-deploy-grr-uat
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-uat-grr-\d{8}-\d+.*$/'

.deploy-grr:local:rules:
  rules:
    - <<: *if-deploy-local
      when: on_success
    - <<: *if-deploy-grr-local
      when: on_success
    - <<: *if-deploy-all-grr
      when: on_success
    - <<: *if-deploy-all
      when: on_success
    - when: never

.deploy-grr:sit:rules:
  rules:
    - <<: *if-deploy-sit
      when: on_success
    - <<: *if-deploy-grr-sit
      when: on_success
    - <<: *if-deploy-all-grr
      when: on_success
    - <<: *if-deploy-all
      when: on_success
    - when: never

.deploy-grr:uat:rules:
  rules:
    - <<: *if-deploy-uat
      when: on_success
    - <<: *if-deploy-grr-uat
      when: on_success
    - <<: *if-deploy-all-grr
      when: on_success
    - <<: *if-deploy-all
      when: on_success
    - when: never
