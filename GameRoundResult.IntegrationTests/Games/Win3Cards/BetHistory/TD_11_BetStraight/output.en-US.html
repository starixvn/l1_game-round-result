<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Tickets</title>
    <link href="/scss/pages/site.css?v=BOY_kqCK2O7Q7XSyBZvmg_ndvZ6Y00LrcrFLSY99iuw" rel="stylesheet" />
    <link href="/scss/pages/game-ticket.css?v=tWY9qylp4iQwW6HaTJabLd629YHRJNZTmjZZR8X9Uxw" rel="stylesheet" />
</head>
<body>
    <div class="main-container">
        <div class="note"><span class="bold">Note:</span> Data are only available within the last 7 days from the current date.</div>
        <div id="game-ticket">
            <table class="table table-bordered table-win3cards">
                <thead>
                    <tr>
                        <th class="col-date">Time (GMT-4)</th>
                        <th>Round ID</th>
                        <th>Result (Dragon | Phoenix)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            12/01/2022
                            <br />
                            03:00:00 AM
                        </td>
                        <td>1</td>
                        <td>
                            <div class="win3cards-result">
                                <div class="cards">
                                    <div class="card card-type-1">
                                        <span>A</span>
                                        <img class="img" src="/scss/images/card_1.png">
                                    </div>
                                    <div class="card card-type-0">
                                        <span>A</span>
                                        <img class="img" src="/scss/images/card_0.png">
                                    </div>
                                    <div class="card card-type-2">
                                        <span>A</span>
                                        <img class="img" src="/scss/images/card_2.png">
                                    </div>
                                    <span class="bold">Three of a Kind</span>
                                </div>
                                <div class="cards">
                                    <div class="card card-type-1">
                                        <span>2</span>
                                        <img class="img" src="/scss/images/card_1.png">
                                    </div>
                                    <div class="card card-type-3">
                                        <span>A</span>
                                        <img class="img" src="/scss/images/card_3.png">
                                    </div>
                                    <div class="card card-type-0">
                                        <span>3</span>
                                        <img class="img" src="/scss/images/card_0.png">
                                    </div>
                                    <span>Straight</span>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th class="col-date">Time (GMT-4)</th>
                        <th>Bet Choice</th>
                        <th>Odds</th>
                        <th>Stake</th>
                        <th>Win</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="">
                        <td>
                            10/25/2022
                            <br />
                            03:10:05 AM
                        </td>
                        <td>Straight</td>
                        <td>8</td>
                        <td>100</td>
                        <td>0</td>
                    </tr>
                    <tr class="total">
                        <td colspan="3" class="text-right">Total</td>
                        <td>100</td>
                        <td>0</td>
                    </tr>
                    <tr class="total">
                        <td colspan="3" class="text-right">Win Loss</td>
                        <td colspan="2" class="text-red">-100</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="overlay">
        <div class="pulse-container">
            <div class="pulse-bubble pulse-bubble-1"></div>
            <div class="pulse-bubble pulse-bubble-2"></div>
            <div class="pulse-bubble pulse-bubble-3"></div>
        </div>
    </div>
    <input type="hidden" value="en-US" id="culture" />
    <script src="/lib/jquery/dist/jquery.js"></script>
    <script src="/lib/jquery-unobtrusive-ajax/jquery.unobtrusive-ajax.js"></script>
</body>
</html>
