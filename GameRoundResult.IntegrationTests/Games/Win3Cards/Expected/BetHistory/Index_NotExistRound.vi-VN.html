<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Tickets</title>
    <link href="/scss/pages/site.css?v=BOY_kqCK2O7Q7XSyBZvmg_ndvZ6Y00LrcrFLSY99iuw" rel="stylesheet" />
    <link href="/scss/pages/game-ticket.css?v=tWY9qylp4iQwW6HaTJabLd629YHRJNZTmjZZR8X9Uxw" rel="stylesheet" />
</head>
<body>
    <div class="main-container">
        <div class="note"><span class="bold">Lưu ý:</span> Bạn chỉ có thể xem dữ liệu cách đây 7 ngày tính từ thời điểm hiện tại.</div>
        <div id="game-ticket">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th class="col-date">Thời Gian (GMT-4)</th>
                        <th>Phiên</th>
                        <th>Kết Quả (Long | Phụng)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3" class="text-center">
                            Không có dữ liệu
                        </td>
                    </tr>
                </tbody>
            </table>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th class="col-date">Thời Gian (GMT-4)</th>
                        <th>Lựa Chọn</th>
                        <th>Tỷ lệ cược</th>
                        <th>Tiền Cược</th>
                        <th>Thắng</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="text-center">
                            Không có dữ liệu
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="overlay">
        <div class="pulse-container">
            <div class="pulse-bubble pulse-bubble-1"></div>
            <div class="pulse-bubble pulse-bubble-2"></div>
            <div class="pulse-bubble pulse-bubble-3"></div>
        </div>
    </div>
    <input type="hidden" value="vi-VN" id="culture" />
    <script src="/lib/jquery/dist/jquery.js"></script>
    <script src="/lib/jquery-unobtrusive-ajax/jquery.unobtrusive-ajax.js"></script>
</body>
</html>
