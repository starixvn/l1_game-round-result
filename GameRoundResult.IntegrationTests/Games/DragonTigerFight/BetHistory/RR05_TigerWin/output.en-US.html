
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Tickets</title>
    
        <link href="/scss/pages/site.css?v=6kx481f_kTctN6lsqufDnj7jhoTxklWd8gjKJCxdwTU" rel="stylesheet" />
    
    
    
    
        <link href="/scss/pages/game-ticket.css?v=NxtNDk8d5b4GKICEiM2-l-SanNkyElu6drlMG0aNqlw" rel="stylesheet" />
    
    


</head>
<body>

    <div class="main-container">
        


<div class="note"><span class="bold">Note:</span> Data are only available within the last 7 days from the current date.</div>

<div id="game-ticket">
    
<table class="table table-bordered table-dragon-tiger">
    <thead>
        <tr>
            <th class="col-date">Time (GMT-4)</th>
            <th>Round</th>
            <th>Result (Dragon | Tiger)</th>
        </tr>
    </thead>
    <tbody>
            <tr>
                <td>
                    07/06/2023
                    <br />
                    05:06:24 AM
                </td>
                <td>21122</td>
                <td>
                    <div class="cards">
                        <div class="card card-type-1">
                            <span>3</span>
                            <img class="img" src="/scss/images/card_1.png?v=csQgoCCKRneWfsVZsKOCiP8G1XUeP2z9Wu5IGPFc6A8" />
                        </div>
                         <div style="margin: auto 15px auto 5px;">
                            <span class="">3</span>
                        </div>
                        <div class="card card-type-1 split">
                            <span>7</span>
                            <img class="img" src="/scss/images/card_1.png?v=csQgoCCKRneWfsVZsKOCiP8G1XUeP2z9Wu5IGPFc6A8" />
                        </div>
                        <div style="margin: auto 5px auto 5px;">
                            <span class="bold">7</span>
                        </div>
                    </div>
                </td>
            </tr>
    </tbody>
</table>

<table class="table table-bordered">
    <thead>
        <tr>
            <th class="col-date">Bet Time (GMT-4)</th>
            <th>Bet Choice</th>
            <th>Odds</th>
            <th>Stake</th>
            <th>Win</th>
        </tr>
    </thead>
    <tbody>
                        <tr class="boldtext-blue">
                            <td>
                                07/06/2023
                                <br />
                                05:05:55 AM
                            </td>
                            <td>Tiger</td>
                            <td>1.9</td>
                            <td>1</td>
                            <td>1.9</td>
                        </tr>
            <tr class="total">
                <td colspan="3" class="text-right">Total</td>
                <td>1</td>
                <td>1.9</td>
            </tr>
            <tr class="total">
                <td colspan="3" class="text-right">Win Loss</td>
                <td colspan="2" class="">0.9</td>
            </tr>
    </tbody>
</table>
</div>


    </div>
    <div id="overlay">
        <div class="pulse-container">
            <div class="pulse-bubble pulse-bubble-1"></div>
            <div class="pulse-bubble pulse-bubble-2"></div>
            <div class="pulse-bubble pulse-bubble-3"></div>
        </div>
    </div>
    <input type="hidden" value="en-US" id="culture" />
    
        <script src="/lib/jquery/dist/jquery.js"></script>
    
    
    
    
        <script src="/lib/jquery-unobtrusive-ajax/jquery.unobtrusive-ajax.js"></script>
    
    

</body>
</html>
