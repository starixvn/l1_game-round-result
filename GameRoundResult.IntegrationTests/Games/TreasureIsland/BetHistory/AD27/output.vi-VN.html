<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Tickets</title>
    <link href="/scss/pages/site.css" rel="stylesheet" />
    <link href="/scss/pages/game-ticket.css" rel="stylesheet" />
</head>
<body>
    <div class="main-container">
        <div class="note"><span class="bold">Lưu ý:</span> Bạn chỉ có thể xem dữ liệu cách đây 7 ngày tính từ thời điểm hiện tại.</div>
        <div id="game-ticket">
            <table class="table table-bordered table-cascading-slot">
                <thead>
                    <tr>
                        <th class="col-round-id">Phiên</th>
                        <th class="col-date">Thời Gian (GMT-4)</th>
                        <th>Mức Cược</th>
                        <th>Giá Trị Xu</th>
                        <th>Tiền Cược</th>
                        <th>Thắng</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="text-center">
                            Không có dữ liệu
                        </td>
                    </tr>
                </tbody>
            </table>

            <table class="table table-bordered table-cascading-slot">
                <thead>
                    <tr>
                        <th>Stt</th>
                        <th>Bảng Kết Quả</th>
                        <th colspan="2">Biểu Tượng Thắng</th>
                        <th>Tiền Thắng</th>
                        <th>Thắng Tumble</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="text-center">
                            Không có dữ liệu
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="overlay">
        <div class="pulse-container">
            <div class="pulse-bubble pulse-bubble-1"></div>
            <div class="pulse-bubble pulse-bubble-2"></div>
            <div class="pulse-bubble pulse-bubble-3"></div>
        </div>
    </div>
    <input type="hidden" value="vi-VN" id="culture" />
    <script src="/lib/jquery/dist/jquery.js"></script>
    <script src="/lib/jquery-unobtrusive-ajax/jquery.unobtrusive-ajax.js"></script>
</body>
</html>
