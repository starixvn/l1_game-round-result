<body>
    <div class="main-container">
        <div class="note">
            <span class="bold">Note:</span>
            Data are only available within the last 7 days from the current date.
        </div>
        <div id="game-ticket">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th class="col-date">Time (GMT-4)</th>
                        <th class="col-round-id">Round</th>
                        <th>Result</th>
                        <th>Winning Option(s)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>08/07/2025<br/>10:55:25 PM</td>
                        <td>1234568</td>
                        <td>
                            <i class="white-chip"></i>
                            <i class="white-chip"></i>
                            <i class="white-chip"></i>
                            <i class="white-chip"></i>
                        </td>
                        <td class="bold text-blue">Even, 4 White</td>
                    </tr>
                </tbody>
            </table>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Bet Choice</th>
                        <th>Bet Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Odd</td>
                        <td class="text-right">50</td>
                    </tr>
                    <tr>
                        <td>3 Red</td>
                        <td class="text-right">25</td>
                    </tr>
                    <tr>
                        <td class="text-right">Total</td>
                        <td class="text-right">75</td>
                    </tr>
                    <tr>
                        <td class="text-right">Total Win</td>
                        <td class="text-right">0</td>
                    </tr>
                    <tr class="total">
                        <td class="bold text-right">Win Loss</td>
                        <td class="bold text-right text-red">-75</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="overlay">
        <div class="pulse-container">
            <div class="pulse-bubble pulse-bubble-1"></div>
            <div class="pulse-bubble pulse-bubble-2"></div>
            <div class="pulse-bubble pulse-bubble-3"></div>
        </div>
    </div>
    <input type="hidden" value="en-US" id="culture"/>
    <script src="/lib/jquery/dist/jquery.js"></script>
    <script src="/lib/jquery-unobtrusive-ajax/jquery.unobtrusive-ajax.js"></script>
</body>
</html>
