<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Tickets</title>
    <link href="/scss/pages/site.css" rel="stylesheet" />
    <link href="/scss/pages/game-ticket.css" rel="stylesheet" />
</head>
<body>
    <div class="main-container">
        <div class="note"><span class="bold">Note:</span> Data are only available within the last 7 days from the current date.</div>
        <div id="game-ticket">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th class="col-date">Time (GMT-4)</th>
                        <th>Round ID</th>
                        <th colspan="2">Result</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td rowspan="1">
                            10/25/2022
                            <br />
                            03:56:59 AM
                        </td>
                        <td rowspan="1">1</td>
                        <td>Spin Result</td>
                        <td>
                            <div style="font-size: 2rem; display: flex; align-items: center; justify-content: center;">
                                <img src="/scss/images/fruitslot/bar100.png"></img>
                                <span> | 10 - Big</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th class="col-date">Time (GMT-4)</th>
                        <th>Bet Choice</th>
                        <th>Odds</th>
                        <th>Stake</th>
                        <th>Win Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            10/25/2022
                            <br />
                            03:56:59 AM
                        </td>
                        <td>
                            <img src="/scss/images/fruitslot/big.png" alt="#" />
                        </td>
                        <td>1.96</td>
                        <td>10</td>
                        <td>19.6</td>
                    </tr>
                    <tr>
                        <td colspan="3" class="bold text-right">Total</td>
                        <td>10</td>
                        <td>20</td>
                    </tr>
                    <tr>
                        <td colspan="3" class="bold text-right">Win Loss</td>
                        <td colspan="2" class="bold ">10</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="overlay">
        <div class="pulse-container">
            <div class="pulse-bubble pulse-bubble-1"></div>
            <div class="pulse-bubble pulse-bubble-2"></div>
            <div class="pulse-bubble pulse-bubble-3"></div>
        </div>
    </div>
    <input type="hidden" value="en-US" id="culture" />
    <script src="/lib/jquery/dist/jquery.js"></script>
    <script src="/lib/jquery-unobtrusive-ajax/jquery.unobtrusive-ajax.js"></script>
</body>
</html>
