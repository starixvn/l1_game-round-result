
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Tickets</title>
    <link href="/scss/pages/site.css?v=-XKJCTpq9i-zZWFg0hKrp1YCySuxo0NbE7nWw45_8sU" rel="stylesheet" />
    <link href="/scss/pages/game-ticket.css?v=FHzs9YI-T0La9XkxeFluMFOZjx6V7BK5poIsrpJNV2w" rel="stylesheet" />
</head>
<body>
    <div class="main-container">
        <div class="note"><span class="bold">Note:</span> Data are only available within the last 7 days from the current date. </div>

        <div id="game-ticket">


            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th class="col-date">Time (GMT-4)</th>
                        <th class="col-round-id">Round</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            11/23/2023
                            <br />
                            12:21:47 AM
                        </td>
                        <td>49619</td>
                        <td>
                            8.26
                        </td>
                    </tr>
                </tbody>
            </table>

            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Time (GMT-4)</th>
                        <th>Option</th>
                        <th>Multiplier</th>
                        <th>Stake</th>
                        <th>Win</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            11/23/2023
                            <br />
                            12:21:17 AM
                        </td>
                        <td colspan="2">Bet Accepted</td>

                        <td class="text-right">1</td>
                        <td class="text-right"></td>
                    </tr>
                    <tr>
                        <td>
                            11/23/2023
                            <br />
                            12:21:47 AM
                        </td>
                        <td colspan="2">Crash</td>

                        <td class="text-right">1</td>
                        <td class="text-right">0</td>
                    </tr>
                    <tr>
                        <td colspan="4" class="text-right">Total</td>
                        <td class="text-right">0</td>
                    </tr>
                    <tr class="total">
                        <td colspan="4" class="bold text-right">Win Loss</td>
                        <td class="bold text-right text-red">-1</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="overlay">
        <div class="pulse-container">
            <div class="pulse-bubble pulse-bubble-1"></div>
            <div class="pulse-bubble pulse-bubble-2"></div>
            <div class="pulse-bubble pulse-bubble-3"></div>
        </div>
    </div>
    <input type="hidden" value="en-US" id="culture" />


    <script src="/lib/jquery/dist/jquery.js"></script>
    <script src="/lib/jquery-unobtrusive-ajax/jquery.unobtrusive-ajax.js"></script>
</body>
</html>
