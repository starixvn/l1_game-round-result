            <tr>

                </td>
                <td>19879</td>
                <td>
                    <div class="baccarat-result">
                        <div class="cards">
                                <div class="card card-type-0">
                                    <span>10</span>
                                    <img class="img" src="/scss/images/card_0.png?v=m5SI5W4NqTw2zu5-TNu1qKNim8Fivjior74R68BhOa8" alt="PlayerCard"/>
                                </div>
                                <div class="card card-type-3">
                                    <span>7</span>
                                    <img class="img" src="/scss/images/card_3.png?v=z7UjU7QNS_GLnOEtRO6frnaOzGsEzeXb53K8LVHkJuw" alt="PlayerCard"/>

                        </div>
                        <div class="cards">
                                <div class="card card-type-3">
                                    <span>2</span>
                                    <img class="img" src="/scss/images/card_3.png?v=z7UjU7QNS_GLnOEtRO6frnaOzGsEzeXb53K8LVHkJuw" alt="BankerCard"/>
                                </div>
                                <div class="card card-type-2">

                                </div>
                        </div>
                    </div>
                </td>
                <td>
Player
                </td>
            </tr>
    </tbody>
</table>

<table class="table table-bordered table-baccarat">
    <thead>
        <tr>
            <th>Bet Choice</th>
            <th>Bet Amount</th>
        </tr>
    </thead>
    <tbody>
                <tr>
                    <td>Banker</td>

                <tr>

            </tr>
