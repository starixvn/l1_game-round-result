<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Tickets</title>

    <link href="/scss/pages/site.css" rel="stylesheet" />

    <link href="/scss/pages/game-ticket.css" rel="stylesheet" />
</head>
<body>

    <div class="main-container">

        <div class="note"><span class="bold">Note:</span> Data are only available within the last 7 days from the current date.</div>

        <div id="game-ticket">

            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th class="col-date">Time (GMT-4)</th>
                        <th class="col-round-id">Round ID</th>
                        <th>Result</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            11/01/2022
                            <br />
                            04:01:00 AM
                        </td>
                        <td>2</td>
                        <td>
                            <img class="dice" src="/scss/images/dice_4.png">
                            <img class="dice" src="/scss/images/dice_3.png">
                            <img class="dice" src="/scss/images/dice_3.png">
                        </td>
                        <td>10</td>
                    </tr>
                </tbody>
            </table>

            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th class="col-date">Bet Time</th>
                        <th>Bet Choice</th>
                        <th>Bet Amount</th>
                        <th>Refund</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            11/01/2022
                            <br />
                            04:01:11 AM
                        </td>
                        <td>Big</td>
                        <td class="text-right">5</td>
                        <td class="text-right">0</td>
                    </tr>
                    <tr>
                        <td>
                            11/01/2022
                            <br />
                            04:01:10 AM
                        </td>
                        <td>Big</td>
                        <td class="text-right">5</td>
                        <td class="text-right">0</td>
                    </tr>
                    <tr>
                        <td></td>
                        <td class="text-right">Total</td>
                        <td class="text-right">10</td>
                        <td class="text-right">0</td>
                    </tr>
                    <tr>
                        <td></td>
                        <td class="text-right">Total Win</td>
                        <td class="text-right">0</td>
                        <td></td>
                    </tr>
                    <tr class="total">
                        <td></td>
                        <td class="bold text-right">Win Loss</td>
                        <td class="bold text-right text-red">-10</td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="overlay">
        <div class="pulse-container">
            <div class="pulse-bubble pulse-bubble-1"></div>
            <div class="pulse-bubble pulse-bubble-2"></div>
            <div class="pulse-bubble pulse-bubble-3"></div>
        </div>
    </div>
    <input type="hidden" value="en-US" id="culture" />

    <script src="/lib/jquery/dist/jquery.js"></script>

    <script src="/lib/jquery-unobtrusive-ajax/jquery.unobtrusive-ajax.js"></script>
</body>
</html>
