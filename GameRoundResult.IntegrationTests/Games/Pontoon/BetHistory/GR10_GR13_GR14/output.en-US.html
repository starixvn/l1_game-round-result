<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Tickets</title>

    <link href="/scss/pages/site.css?v=UIrT1XfgGCImQ8vRZxqhtVlwkf8o6h414xpWZqyZq0s" rel="stylesheet" />

    <link href="/scss/pages/game-ticket.css?v=Vz4Ek5fttgOjaquU6DancSql2jDVAVw_KvDzAn3H5_8" rel="stylesheet" />
</head>
<body>

    <div class="main-container">

        <div class="note"><span class="bold">Note:</span> Data are only available within the last 7 days from the current date. </div>

        <div id="game-ticket">

            <table class="table table-bordered table-blackjack">
                <thead>
                    <tr>
                        <th class="col-date">Time (GMT-4)</th>
                        <th class="col-round-id">Hand ID</th>
                        <th colspan="2">Dealer</th>
                        <th colspan="2">Player</th>
                        <th>Stake</th>
                        <th>Win Loss</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" class="text-center">
                            No data available
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="overlay">
        <div class="pulse-container">
            <div class="pulse-bubble pulse-bubble-1"></div>
            <div class="pulse-bubble pulse-bubble-2"></div>
            <div class="pulse-bubble pulse-bubble-3"></div>
        </div>
    </div>
    <input type="hidden" value="en-US" id="culture" />

    <script src="/lib/jquery/dist/jquery.js"></script>

    <script src="/lib/jquery-unobtrusive-ajax/jquery.unobtrusive-ajax.js"></script>
</body>
</html>
