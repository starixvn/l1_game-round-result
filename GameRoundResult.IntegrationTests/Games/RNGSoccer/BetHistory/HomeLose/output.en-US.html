
<!DOCTYPE html>

    <title>Game Tickets</title>

<body >

    <div class="main-container">
        

<div class="note"><span class="bold">Note:</span> Data are only available within the last 7 days from the current date. </div>

<div id="game-ticket">
    


<table class="table table-bordered table-dragon-tiger-fight">
    <thead>
        <tr>
            <th class="col-date">Time (GMT-4)</th>
            <th>Round</th>
            <th>Result (Home | Away)</th>
        </tr>
    </thead>
    <tbody>
            <tr>
                <td>
                    04/15/2025
                    <br />
                    02:00:27 AM
                </td>
                <td>32559</td>
                <td>
                    <div class="cards">
                        <div class="card card-type-2">
                            <span>8</span>
                            <img class="img" src="/scss/images/card_2.png?v=HKTI_eQSrSNTxEqbPYtVYGSEtCAfLaNb3R38EYn_2iM" />

                        </div>
                        <div style="margin: auto 15px auto 5px;">
                            <span class="">8</span>
                        </div>

                        <div class="card card-type-3 split">
                            <span>9</span>
                            <img class="img" src="/scss/images/card_3.png?v=z7UjU7QNS_GLnOEtRO6frnaOzGsEzeXb53K8LVHkJuw" />

                        </div>

                        <div style="margin: auto 5px auto 5px;">
                            <span class="bold">9</span>
                        </div>
                    </div>
                </td>
            </tr>
    </tbody>
</table>

<table class="table table-bordered">
    <thead>
        <tr>
            <th class="col-date">Bet Time (GMT-4)</th>
            <th>Bet Choice</th>
            <th>Odds</th>
            <th>Stake</th>
            <th>Win</th>
        </tr>
    </thead>
    <tbody>
                <tr class="">
                    <td>
                        04/15/2025
                        <br />
                        01:00:27 AM
                    </td>
                    <td>Home</td>
                    <td>2</td>
                    <td>1</td>
                    <td>0</td>
                </tr>
            <tr class="total">
                <td colspan="3" class="text-right">Total</td>
                <td>1</td>
                <td>0</td>
            </tr>
            <tr class="total">
                <td colspan="3" class="text-right">Win Loss</td>
                <td colspan="2" class="text-red">-1</td>
            </tr>
    </tbody>
</table>
</div>



    </div>
    <div id="overlay">
        <div class="pulse-container">
            <div class="pulse-bubble pulse-bubble-1"></div>
            <div class="pulse-bubble pulse-bubble-2"></div>
            <div class="pulse-bubble pulse-bubble-3"></div>
        </div>
    </div>
    <input type="hidden" value="en-US" id="culture" />
